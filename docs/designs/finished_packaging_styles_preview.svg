<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151a"/>
      <stop offset="0.48" stop-color="#1b1f25"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <radialGradient id="pageGlow" cx="50%" cy="12%" r="70%">
      <stop offset="0" stop-color="#5d6b7a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sceneSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5864"/>
      <stop offset="0.42" stop-color="#2b323b"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <radialGradient id="sceneLight" cx="52%" cy="28%" r="52%">
      <stop offset="0" stop-color="#f3bd79" stop-opacity="0.72"/>
      <stop offset="0.34" stop-color="#b96c54" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242b"/>
      <stop offset="1" stop-color="#090a0c"/>
    </linearGradient>
    <linearGradient id="blackBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030303"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="newsBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.5" stop-color="#252525"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="neonBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#201437"/>
      <stop offset="0.48" stop-color="#11131f"/>
      <stop offset="1" stop-color="#082b31"/>
    </linearGradient>
    <linearGradient id="retroBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24100f"/>
      <stop offset="0.5" stop-color="#3b1715"/>
      <stop offset="1" stop-color="#170b0a"/>
    </linearGradient>
    <linearGradient id="minimalBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.56"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4de8ff" flood-opacity="0.8"/>
    </filter>
    <filter id="glowRose" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff4db8" flood-opacity="0.75"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <pattern id="diagonal" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="8" fill="#ffffff" opacity="0.13"/>
    </pattern>
    <symbol id="baseScene" viewBox="0 0 270 480">
      <rect width="270" height="480" fill="url(#sceneSky)"/>
      <rect width="270" height="480" fill="url(#sceneLight)"/>
      <path d="M0 214 C68 196 185 198 270 216 L270 480 L0 480 Z" fill="url(#floorGlow)"/>
      <path d="M48 208 L112 90 L128 212 Z" fill="#151922" opacity="0.72"/>
      <path d="M222 210 L158 92 L143 214 Z" fill="#11151d" opacity="0.72"/>
      <path d="M70 480 L118 225 L151 225 L204 480 Z" fill="#23272e" opacity="0.72"/>
      <path d="M84 480 L126 225 L144 225 L185 480 Z" fill="#15181e" opacity="0.8"/>
      <ellipse cx="136" cy="242" rx="32" ry="7" fill="#f0bc79" opacity="0.18"/>
      <circle cx="132" cy="214" r="15" fill="#1b1715"/>
      <path d="M112 240 C119 222 148 222 157 240 L165 306 C168 332 102 333 105 306 Z" fill="#614436"/>
      <path d="M116 241 C129 252 144 252 157 241 L155 286 C145 292 126 292 117 286 Z" fill="#7b5a47"/>
      <path d="M104 260 C82 275 71 292 62 320" fill="none" stroke="#352921" stroke-width="11" stroke-linecap="round"/>
      <path d="M166 260 C188 273 200 292 209 320" fill="none" stroke="#33261e" stroke-width="11" stroke-linecap="round"/>
      <path d="M118 316 L108 394" stroke="#191919" stroke-width="15" stroke-linecap="round"/>
      <path d="M152 316 L162 394" stroke="#191919" stroke-width="15" stroke-linecap="round"/>
      <path d="M42 260 C56 228 89 228 101 262 L107 480 L39 480 Z" fill="#0c0e12" opacity="0.72"/>
      <circle cx="72" cy="218" r="12" fill="#080a0d" opacity="0.76"/>
      <path d="M176 258 C190 230 218 230 231 262 L239 480 L170 480 Z" fill="#090b0f" opacity="0.66"/>
      <circle cx="204" cy="220" r="12" fill="#07090d" opacity="0.7"/>
      <rect y="0" width="270" height="480" fill="#000000" opacity="0.08"/>
      <rect y="0" width="270" height="480" filter="url(#grain)" opacity="0.34"/>
    </symbol>
    <clipPath id="phoneClipA"><rect x="75" y="252" width="270" height="480" rx="24"/></clipPath>
    <clipPath id="phoneClipB"><rect x="425" y="252" width="270" height="480" rx="24"/></clipPath>
    <clipPath id="phoneClipC"><rect x="775" y="252" width="270" height="480" rx="24"/></clipPath>
    <clipPath id="phoneClipD"><rect x="1125" y="252" width="270" height="480" rx="24"/></clipPath>
    <clipPath id="phoneClipE"><rect x="1475" y="252" width="270" height="480" rx="24"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#pageBg)"/>
  <rect width="1920" height="1080" fill="url(#pageGlow)"/>

  <text x="96" y="98" fill="#f4f0e8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="700">成片包装样式预览</text>
  <text x="96" y="145" fill="#aeb6c0" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22">已去掉“高能追剧标题款”；以下仅为设计方向，不接入剪辑流程。</text>
  <text x="1740" y="112" text-anchor="end" fill="#7f8790" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">9:16 竖屏安全区示意</text>

  <!-- 1. Cinematic black border -->
  <g filter="url(#softShadow)">
    <rect x="67" y="244" width="286" height="496" rx="31" fill="#050607"/>
    <g clip-path="url(#phoneClipA)">
      <use href="#baseScene" x="75" y="252" width="270" height="480"/>
      <rect x="75" y="252" width="270" height="74" fill="url(#blackBand)"/>
      <rect x="75" y="654" width="270" height="78" fill="url(#blackBand)"/>
      <rect x="75" y="326" width="270" height="1.2" fill="#e8e0d5" opacity="0.55"/>
      <rect x="75" y="654" width="270" height="1.2" fill="#e8e0d5" opacity="0.55"/>
      <text x="210" y="291" text-anchor="middle" fill="#f5efe5" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700">影视画面 · 剧情演绎</text>
      <text x="210" y="684" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="27" font-weight="800">请勿模仿</text>
      <text x="210" y="711" text-anchor="middle" fill="#bfb7ac" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13">危险动作均为剧情需要</text>
      <path d="M92 273 h23 M92 273 v23 M328 273 h-23 M328 273 v23 M92 711 h23 M92 711 v-23 M328 711 h-23 M328 711 v-23" fill="none" stroke="#f1eadf" stroke-width="1.4" opacity="0.72"/>
    </g>
    <rect x="75" y="252" width="270" height="480" rx="24" fill="none" stroke="#2a2d31" stroke-width="1.5"/>
  </g>
  <text x="210" y="800" text-anchor="middle" fill="#f1eee8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">电影黑边警示款</text>
  <text x="210" y="834" text-anchor="middle" fill="#9ea6af" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">稳、通用、最不抢戏</text>

  <!-- 2. News documentary -->
  <g filter="url(#softShadow)">
    <rect x="417" y="244" width="286" height="496" rx="31" fill="#050607"/>
    <g clip-path="url(#phoneClipB)">
      <use href="#baseScene" x="425" y="252" width="270" height="480"/>
      <rect x="425" y="252" width="270" height="70" fill="url(#newsBand)"/>
      <rect x="425" y="648" width="270" height="84" fill="#050505" opacity="0.96"/>
      <rect x="425" y="252" width="76" height="70" fill="#c31922"/>
      <rect x="425" y="648" width="270" height="8" fill="#c31922"/>
      <rect x="610" y="260" width="74" height="22" fill="url(#diagonal)" opacity="0.45"/>
      <text x="463" y="281" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="800">警示</text>
      <text x="463" y="303" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700">ALERT</text>
      <text x="520" y="282" fill="#f8f8f8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="800">影视情节演绎</text>
      <text x="520" y="306" fill="#cfd4d9" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12">非现实行为建议</text>
      <text x="560" y="686" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="25" font-weight="900">危险情节 请勿模仿</text>
      <text x="560" y="713" text-anchor="middle" fill="#b5b8bc" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12">剧情片段仅供观赏</text>
    </g>
    <rect x="425" y="252" width="270" height="480" rx="24" fill="none" stroke="#2a2d31" stroke-width="1.5"/>
  </g>
  <text x="560" y="800" text-anchor="middle" fill="#f1eee8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">新闻纪实提示款</text>
  <text x="560" y="834" text-anchor="middle" fill="#9ea6af" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">硬朗、警示感强</text>

  <!-- 3. Neon mood -->
  <g filter="url(#softShadow)">
    <rect x="767" y="244" width="286" height="496" rx="31" fill="#050607"/>
    <g clip-path="url(#phoneClipC)">
      <use href="#baseScene" x="775" y="252" width="270" height="480"/>
      <rect x="775" y="252" width="270" height="78" fill="url(#neonBand)" opacity="0.96"/>
      <rect x="775" y="646" width="270" height="86" fill="url(#neonBand)" opacity="0.96"/>
      <line x1="788" y1="323" x2="1032" y2="323" stroke="#4de8ff" stroke-width="2" filter="url(#glowCyan)"/>
      <line x1="788" y1="649" x2="1032" y2="649" stroke="#ff4db8" stroke-width="2" filter="url(#glowRose)"/>
      <circle cx="807" cy="289" r="5" fill="#4de8ff" filter="url(#glowCyan)"/>
      <circle cx="1021" cy="289" r="5" fill="#ff4db8" filter="url(#glowRose)"/>
      <text x="910" y="288" text-anchor="middle" fill="#ffffff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" letter-spacing="1.8">MIDNIGHT CUT</text>
      <text x="910" y="310" text-anchor="middle" fill="#b9eff6" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12">影视画面 · 氛围剪辑</text>
      <text x="910" y="684" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="800">请理性观看</text>
      <text x="910" y="712" text-anchor="middle" fill="#d9c7f0" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13">剧情演绎 请勿模仿</text>
      <path d="M801 356 C836 336 862 343 886 360" fill="none" stroke="#4de8ff" stroke-width="1.1" opacity="0.34"/>
      <path d="M956 574 C987 552 1014 560 1035 580" fill="none" stroke="#ff4db8" stroke-width="1.1" opacity="0.34"/>
    </g>
    <rect x="775" y="252" width="270" height="480" rx="24" fill="none" stroke="#243b40" stroke-width="1.5"/>
  </g>
  <text x="910" y="800" text-anchor="middle" fill="#f1eee8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">霓虹氛围款</text>
  <text x="910" y="834" text-anchor="middle" fill="#9ea6af" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">年轻、都市、悬疑感</text>

  <!-- 4. Retro HK -->
  <g filter="url(#softShadow)">
    <rect x="1117" y="244" width="286" height="496" rx="31" fill="#050607"/>
    <g clip-path="url(#phoneClipD)">
      <use href="#baseScene" x="1125" y="252" width="270" height="480"/>
      <rect x="1125" y="252" width="270" height="76" fill="url(#retroBand)" opacity="0.98"/>
      <rect x="1125" y="646" width="270" height="86" fill="url(#retroBand)" opacity="0.98"/>
      <rect x="1142" y="268" width="236" height="44" rx="4" fill="none" stroke="#d9b46d" stroke-width="1.2" opacity="0.85"/>
      <path d="M1148 290 h32 M1340 290 h32 M1162 668 h196" stroke="#d9b46d" stroke-width="1.2" opacity="0.72"/>
      <text x="1260" y="294" text-anchor="middle" fill="#f7d795" font-family="Microsoft YaHei, PingFang SC, SimSun, serif" font-size="20" font-weight="800">影像档案</text>
      <text x="1260" y="314" text-anchor="middle" fill="#b89055" font-family="Arial, serif" font-size="10" font-weight="700">CINEMA ARCHIVE</text>
      <text x="1260" y="686" text-anchor="middle" fill="#f8d99a" font-family="Microsoft YaHei, PingFang SC, SimSun, serif" font-size="25" font-weight="800">剧情演绎</text>
      <text x="1260" y="713" text-anchor="middle" fill="#d7b071" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13">影视画面 请勿模仿</text>
      <circle cx="1153" cy="279" r="2.5" fill="#d9b46d" opacity="0.9"/>
      <circle cx="1367" cy="279" r="2.5" fill="#d9b46d" opacity="0.9"/>
      <circle cx="1153" cy="301" r="2.5" fill="#d9b46d" opacity="0.9"/>
      <circle cx="1367" cy="301" r="2.5" fill="#d9b46d" opacity="0.9"/>
    </g>
    <rect x="1125" y="252" width="270" height="480" rx="24" fill="none" stroke="#3a2a21" stroke-width="1.5"/>
  </g>
  <text x="1260" y="800" text-anchor="middle" fill="#f1eee8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">复古港风款</text>
  <text x="1260" y="834" text-anchor="middle" fill="#9ea6af" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">年代感、情绪更浓</text>

  <!-- 5. Minimal safety -->
  <g filter="url(#softShadow)">
    <rect x="1467" y="244" width="286" height="496" rx="31" fill="#050607"/>
    <g clip-path="url(#phoneClipE)">
      <use href="#baseScene" x="1475" y="252" width="270" height="480"/>
      <rect x="1475" y="252" width="270" height="62" fill="url(#minimalBand)"/>
      <rect x="1475" y="666" width="270" height="66" fill="url(#minimalBand)"/>
      <rect x="1491" y="313" width="238" height="1" fill="#ffffff" opacity="0.36"/>
      <rect x="1491" y="666" width="238" height="1" fill="#ffffff" opacity="0.36"/>
      <text x="1610" y="289" text-anchor="middle" fill="#f2f2f2" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700">影视片段</text>
      <text x="1610" y="697" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="23" font-weight="800">剧情演绎 请勿模仿</text>
      <text x="1610" y="720" text-anchor="middle" fill="#aeb4ba" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11">仅作内容包装与安全提示</text>
    </g>
    <rect x="1475" y="252" width="270" height="480" rx="24" fill="none" stroke="#2a2d31" stroke-width="1.5"/>
  </g>
  <text x="1610" y="800" text-anchor="middle" fill="#f1eee8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">极简平台安全款</text>
  <text x="1610" y="834" text-anchor="middle" fill="#9ea6af" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">适合批量默认模板</text>

  <rect x="96" y="904" width="1728" height="1" fill="#ffffff" opacity="0.1"/>
  <text x="96" y="950" fill="#c6cbd1" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700">设计备注</text>
  <text x="96" y="986" fill="#8f98a3" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">上下遮挡建议控制在画面高度 12%-16%，底部文案避开字幕区；批量生产优先使用黑边款或极简款。</text>
  <text x="96" y="1018" fill="#8f98a3" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">所有文案可参数化：主警示语、辅助说明、片名/频道名、集数标签都可以后续做成配置。</text>
</svg>
